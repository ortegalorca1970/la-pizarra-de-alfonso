<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Pizarra de Alfonso · Física y Química</title>
<meta name="description" content="Vídeos, apuntes, problemas resueltos y exámenes de Física y Química de 2º ESO a 2º Bachillerato, ordenados por curso y tema. Prof. Alfonso Ortega Lorca.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: alegre, cercana y clara, para estudiantes; IDEA: cuaderno de clase con marcadores de colores;
   PICTURE: dibujo de laboratorio (átomo, matraz, onda) con fórmulas en la portada; COLOUR: fondo blanco, tinta oscura,
   cada curso con un tono pastel de fondo (texto siempre oscuro) y un color fuerte para detalles; TYPE: Fredoka + Nunito;
   LAYOUT: tarjetas redondeadas, temas en barra lateral, pestañas en forma de píldora. */
:root{--bg:#fff;--soft:#f6f7fb;--line:#e5e7ef;--ink:#1d1b2e;--mute:#555a6e;--brand:#5b3fd1;--brand-t:#ece8ff;--c:#5b3fd1;--t:#ece8ff}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif;overflow-x:clip}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0;letter-spacing:-.005em}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}

/* cabecera */
header{position:sticky;top:0;z-index:40;background:#fff;box-shadow:0 6px 18px rgba(29,27,46,.06)}
header::after,footer::before{content:"";display:block;height:6px;background:linear-gradient(90deg,#16a34a 0 16.6%,#0284c7 0 33.3%,#7c3aed 0 50%,#ea580c 0 66.6%,#db2777 0 83.3%,#eab308 0)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:18px;height:72px}
.brand{display:flex;align-items:center;gap:12px;font:600 22px/1.1 Fredoka,sans-serif;white-space:nowrap}
.brand small{display:block;font:700 12.5px Nunito,system-ui,sans-serif;color:var(--mute)}
.mark{width:44px;height:44px;border-radius:14px;background:#245746;position:relative;flex:none;transform:rotate(-4deg);box-shadow:inset 0 -6px 0 #b07a3c}
.mark::before{content:"F·Q";position:absolute;inset:0 0 6px;display:grid;place-items:center;color:#fff;font:600 15px Fredoka,Nunito,sans-serif}
nav.desk{display:flex;gap:4px}
.ddw{position:relative}
.ddb{display:flex;align-items:center;gap:8px;padding:9px 13px;border:2px solid transparent;border-radius:999px;background:none;font-weight:800;font-size:15px;min-height:44px}
.ddb:hover,.ddw.open .ddb{background:var(--t)}
.ddb.cur{background:var(--t);border-color:var(--c)}
.dd{position:absolute;top:100%;left:0;padding-top:10px;width:340px;visibility:hidden;opacity:0;transform:translateY(6px);transition:.15s}
.ddw.r .dd{left:auto;right:0}
.ddw:hover .dd,.ddw:focus-within .dd,.ddw.open .dd{visibility:visible;opacity:1;transform:none}
.ddp{background:#fff;color:var(--ink);border:2px solid var(--c);border-radius:18px;box-shadow:0 18px 40px rgba(29,27,46,.16);padding:8px;overflow:hidden}
.ddp a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;font-size:15px;font-weight:700;line-height:1.3}
.ddp a:hover{background:var(--t)}
.ddp a b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--t);color:var(--ink);display:grid;place-items:center;font-size:13.5px}
.ddp .all{background:var(--t);margin-bottom:6px;justify-content:space-between;font-weight:800}
.ddp .all span{color:var(--c)}
.mobb{display:none;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;min-height:44px}
#mob{display:none;padding:10px max(4vw,16px) 16px;max-height:75vh;overflow:auto;background:#fff;border-top:1px solid var(--line)}
#mob details{background:var(--t);border-radius:16px;margin-bottom:8px;overflow:hidden}
#mob summary{padding:13px 16px;font-weight:800;display:flex;gap:10px;align-items:center;cursor:pointer}
#mob a{display:block;padding:10px 16px;font-size:15.5px;font-weight:700;background:#fff;border-top:1px solid var(--line)}
@media(max-width:1120px){nav.desk{display:none}.mobb{display:block}#mob.on{display:block}}
.mobb{white-space:nowrap;flex:none}
@media(max-width:480px){.brand{font-size:18px;gap:9px}.brand small{display:none}.mark{width:38px;height:38px}.mobb{padding:8px 12px}}

/* buscador */
.sbox{position:relative}
.sbox input{width:100%;font:600 17px Nunito,system-ui,sans-serif;padding:15px 18px 15px 50px;border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.sbox input::placeholder{color:#6b6f82}
.sbox input:focus{outline:none;border-color:var(--brand);box-shadow:0 5px 0 var(--brand)}
.sbox svg{position:absolute;left:19px;top:18px}
.sres{display:none;position:absolute;left:0;right:0;top:calc(100% + 14px);background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:20px;box-shadow:0 18px 40px rgba(29,27,46,.18);max-height:420px;overflow:auto;z-index:30;padding:8px}
.sres.on{display:block}
.sres a{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px}
.sres a:hover{background:var(--t)}
.sres small{display:block;color:var(--mute);font-size:13.5px;font-weight:600}
.sres .dot{margin-top:7px}
.sres .k{font-size:13px;font-weight:800;color:var(--mute);margin:6px 12px 2px}

/* portada */
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#ede9fe 0%,#fce7f3 45%,#fef9c3 100%);border-bottom:3px solid var(--ink)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:340px;height:340px;left:-120px;bottom:-160px;background:#bae6fd;opacity:.7}
.hero::after{width:220px;height:220px;right:38%;top:-110px;background:#bbf7d0;opacity:.8}
.hgrid{position:relative;z-index:1}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:clamp(24px,4vw,56px);align-items:center;padding-block:clamp(36px,5vw,68px)}
.hero h1{font-size:clamp(38px,5.4vw,62px);line-height:1.05;font-weight:700;text-wrap:balance}
.hero h1 span{background:linear-gradient(transparent 62%,#ffd84d 62% 92%,transparent 92%);padding:0 .08em}
.hero p.lede{font-size:19px;color:#3d3a52;margin:16px 0 28px;max-width:32em;font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.stats div:nth-child(1){background:#fee2e2}.stats div:nth-child(2){background:#dbeafe}.stats div:nth-child(3){background:#dcfce7}
.stats div{border:2px solid var(--ink);border-radius:16px;padding:8px 16px;font-weight:700;font-size:14.5px;color:var(--mute)}
.stats b{font:600 22px Fredoka,Nunito,sans-serif;color:var(--ink);margin-right:6px}
.doodle{width:100%;height:auto;display:block}
@media(max-width:900px){.hgrid{grid-template-columns:1fr}.doodle{max-width:480px;margin:0 auto}}

.band{padding:clamp(40px,5vw,72px) 0}
.band.alt{background:#ecfeff}
.band.alt2{background:linear-gradient(120deg,#fef3c7,#fce7f3)}
.sh{margin-bottom:24px}
.sh h2{font-size:clamp(28px,3.2vw,38px)}
.sh p{margin:6px 0 0;color:var(--mute);font-weight:600}
.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media(max-width:900px){.courses{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.courses{grid-template-columns:1fr}}
.cc{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;background:var(--t);border:3px solid var(--ink);border-radius:24px;padding:0 22px 18px;box-shadow:0 6px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.cc:hover{transform:translateY(-4px);box-shadow:0 10px 0 var(--ink)}
.cc .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -22px;padding:16px 22px;background:var(--c);border-bottom:3px solid var(--ink)}
.cc::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.18}
.cc .lv{font:700 clamp(30px,3.4vw,38px)/1 Fredoka,Nunito,sans-serif;color:#fff}
.cc .badge{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 11px;font-weight:800;font-size:13px;white-space:nowrap}
.cc .nm{font-weight:800;font-size:17px}
.cc .nums{display:flex;flex-wrap:wrap;gap:8px}
.cc .nums span{background:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.cc .go{margin-top:auto;align-self:flex-start;font-weight:800;color:#fff;background:var(--c);border-radius:999px;padding:6px 16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.how div{border:3px solid var(--ink);border-radius:22px;padding:20px;box-shadow:0 5px 0 var(--ink)}
.how div:nth-child(1){background:#ffe4e6}.how div:nth-child(2){background:#e0f2fe}.how div:nth-child(3){background:#fef3c7}
.how i{background:#fff!important;border:2px solid var(--ink)}
.how i{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;font:normal 600 20px Fredoka,Nunito,sans-serif;margin-bottom:10px}
.how h3{font-size:20px;margin-bottom:6px}
.how p{margin:0;color:var(--mute);font-weight:600;font-size:15.5px}
@media(max-width:760px){.how{grid-template-columns:1fr}}

/* tarjetas de vídeo */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:20px}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr))}
.grid.solo{grid-template-columns:minmax(0,860px)}
.card{border:2px solid var(--ink);border-top:8px solid var(--c);border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 5px 0 var(--ink)}
.grid>.card:nth-child(6n+1){--c:#db2777}.grid>.card:nth-child(6n+2){--c:#0284c7}.grid>.card:nth-child(6n+3){--c:#16a34a}.grid>.card:nth-child(6n+4){--c:#ea580c}.grid>.card:nth-child(6n+5){--c:#7c3aed}.grid>.card:nth-child(6n+6){--c:#eab308}
.layout .grid>.card{--c:inherit}
.ph{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;background:#1d1b2e}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .pl{position:absolute;inset:0;margin:auto;width:66px;height:66px;border-radius:50%;background:#e01e37;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(255,255,255,.45);transition:transform .15s}
.ph:hover .pl{transform:scale(1.1)}
.ph .n{position:absolute;right:10px;bottom:10px;background:#fff;color:var(--ink);font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px}
.card .cb{padding:13px 16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card .cb p{margin:0;font-weight:800;line-height:1.35;flex:1}
.card .cb a{flex:none;font-size:14px;font-weight:800;color:#b3122a;white-space:nowrap}
iframe{display:block;width:100%;aspect-ratio:16/9;border:0}

/* curso */
.chead{position:relative;overflow:hidden;background:linear-gradient(110deg,var(--t) 0%,#fff 130%);border-bottom:3px solid var(--ink)}
.chead::before{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:var(--c);opacity:.16}
.chead::after{content:"";position:absolute;left:38%;bottom:-70px;width:150px;height:150px;border-radius:50%;background:var(--c);opacity:.10}
.chg{position:relative;z-index:1}
.chead h1 .lv{display:inline-block;background:var(--c);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:0 14px;margin-right:10px;transform:rotate(-2deg)}
.chg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:24px;align-items:end;padding-block:30px 34px}
.crumb{font-size:14.5px;font-weight:700;color:#3d3a52;margin-bottom:8px}.crumb a{text-decoration:underline;text-underline-offset:3px}
.chead h1{font-size:clamp(34px,4.6vw,54px);line-height:1.05;font-weight:700}
@media(max-width:860px){.chg{grid-template-columns:1fr}}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:36px;align-items:start;padding-block:32px}
.side{position:sticky;top:92px;display:flex;flex-direction:column;gap:6px}
.side p{margin:0 0 4px;font-size:14px;font-weight:800;color:var(--mute)}
.side a{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:16px;border:2px solid transparent;font-size:15px;font-weight:700;line-height:1.3}
.side a b{width:32px;height:32px;border-radius:50%;background:var(--t);display:grid;place-items:center;font-size:14px}
.side a small{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-top:3px}
.side a:hover{background:var(--soft)}
.side a.on{background:var(--t);border-color:var(--ink)}
.side a.on b{background:var(--c);color:#fff}
.side a b{border:2px solid var(--c)}
.side .rv{color:#9a4a00;font-weight:800}
@media(max-width:900px){.layout{grid-template-columns:1fr;gap:18px}.side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}.side p{display:none}.side a{flex:none;width:210px;background:var(--soft)}}
.thead h2{font-size:clamp(28px,3.2vw,38px);line-height:1.15}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.meta span{background:var(--t);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;color:var(--mute)}
.meta b{color:var(--ink)}
.code{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff;border:2px solid var(--ink);color:var(--ink);padding:2px 8px;border-radius:8px;white-space:nowrap}
.meta .code{background:#fff;color:var(--ink);padding:2px 10px}
.warn{background:#fff4d6;border:2px solid #e9b949;border-radius:14px;padding:10px 14px;margin:14px 0 0;font-weight:700;font-size:15px}
.tabs{display:flex;gap:10px;margin:24px 0 22px;overflow-x:auto;padding-bottom:6px}
.tab{flex:none;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:9px 18px;font-weight:800;font-size:15.5px;min-height:44px}
.tab:hover{background:var(--t)}
.tab[data-tab=videos]{--k:#be123c;--kt:#ffe4e6}.tab[data-tab=apuntes]{--k:#0369a1;--kt:#e0f2fe}.tab[data-tab=problemas]{--k:#6d28d9;--kt:#ede9fe}.tab[data-tab=examenes]{--k:#c2410c;--kt:#ffedd5}
.tab{background:var(--kt)}.tab:hover{background:var(--kt);box-shadow:0 4px 0 var(--k)}
.tab.on{background:var(--k);color:#fff;border-color:var(--ink)}
.tab span{display:inline-block;min-width:24px;margin-left:8px;padding:0 7px;border-radius:999px;background:var(--t);color:var(--ink);font-size:13px}
.docs{display:flex;flex-direction:column;gap:12px}
.doc.apuntes{--k:#0369a1;--kt:#e0f2fe}.doc.problemas{--k:#6d28d9;--kt:#ede9fe}.doc.examenes{--k:#c2410c;--kt:#ffedd5}
.doc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:2px solid var(--line);border-left:8px solid var(--k);border-radius:18px;background:#fff;transition:border-color .15s,background .15s}
.doc:hover{border-color:var(--ink);border-left-color:var(--k);background:var(--kt)}
.pdf{width:42px;height:48px;border-radius:10px;background:var(--kt);color:var(--k);border:2px solid var(--k);display:grid;place-items:center;font:600 13px Fredoka,Nunito,sans-serif}
.doc .t{font-weight:800;line-height:1.35}
.doc .s{font-size:13.5px;font-weight:700;color:var(--mute);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.doc .btn{background:var(--k)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;font-size:14.5px;white-space:nowrap;min-height:44px}
.btn:hover{background:var(--brand)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.ghost:hover{background:var(--t)}
@media(max-width:560px){.doc{grid-template-columns:auto minmax(0,1fr)}.doc .btn{grid-column:2;justify-self:start}}
.empty{border:3px dashed #c9c6dc;border-radius:20px;padding:34px 20px;text-align:center;color:var(--mute);font-weight:700}
.empty b{color:var(--ink)}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:36px}
table.ov{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:15.5px}
table.ov th{text-align:left;font-size:13px;color:var(--mute);font-weight:800;padding:0 14px}
table.ov td{padding:13px 14px;background:var(--t);font-weight:700}
table.ov tr:nth-child(even) td{background:#fff;box-shadow:inset 0 0 0 2px var(--t)}
table.ov td:first-child{border-radius:14px 0 0 14px}table.ov td:last-child{border-radius:0 14px 14px 0}
table.ov td.n,table.ov th.n{text-align:right;font-variant-numeric:tabular-nums}
table.ov tr:hover td{background:#fff;box-shadow:inset 0 0 0 2px var(--c)}
footer{background:#1d1b2e;color:#e7e5f2}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding-block:30px;font-weight:700}
footer .f{font:600 22px Fredoka,Nunito,sans-serif;color:#fff}
footer a{color:#ffd84d}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:600px){.stack thead{display:none}.stack tr{display:grid;margin-bottom:8px}.stack td{border-radius:0!important;padding:6px 14px}.stack td:first-child{border-radius:14px 14px 0 0!important;padding-top:12px}.stack td:last-child{border-radius:0 0 14px 14px!important;padding-bottom:12px}.stack td.n{text-align:left}.stack td.n::before{content:attr(data-l)': ';color:var(--mute)}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

/* Color de cada curso: c = color fuerte (detalles), t = fondo pastel (siempre con texto oscuro) */
const LOOK = {
  '2-eso':{c:'#15803d',t:'#dcfce7',lv:'2º ESO',sub:'Física y Química'}, '3-eso':{c:'#0369a1',t:'#dbeafe',lv:'3º ESO',sub:'Física y Química'}, '4-eso':{c:'#6d28d9',t:'#ede9fe',lv:'4º ESO',sub:'Física y Química'},
  '1-bach':{c:'#c2410c',t:'#ffedd5',lv:'1º Bach',sub:'Física y Química'}, 'quimica-2-bach':{c:'#be185d',t:'#fce7f3',lv:'Química',sub:'2º Bachillerato'}, 'fisica-2-bach':{c:'#a16207',t:'#fef3c7',lv:'Física',sub:'2º Bachillerato'}
};
const CODE = {'2-eso':'E2','3-eso':'E3','4-eso':'E4','1-bach':'B1','quimica-2-bach':'Q2B','fisica-2-bach':'F2B'};
const sty = id => `--c:${LOOK[id].c};--t:${LOOK[id].t}`;

/* ===================== utilidades ===================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const code = (c,i) => CODE[c.id] + '_T' + String(i+1).padStart(2,'0');
const cnt = keys => keys.reduce((s,k)=> s + (L[k][2]||0), 0);
const vids = c => (c.course?L[c.course][2]:0) + (c.course2?L[c.course2][2]:0) || cnt([...new Set(c.topics.flatMap(t=>t.pl))]);
const mats = (c,i) => MATS[c.id+'/'+(i+1)] || [];
const nmat = c => c.topics.reduce((s,t,i)=>s+mats(c,i).length,0);
const size = kb => kb>=1024 ? (kb/1024).toFixed(1).replace('.',',')+' MB' : kb+' KB';
const plural = (n,a,b) => n===1?a:b;
const app = document.getElementById('app');
const SRCH = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1d1b2e" stroke-width="2.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`;
let tab = 'videos';

function card(key){
  const [id, first, n, title] = L[key];
  return `<div class="card">
    <button class="ph" data-play="${esc(id)}" aria-label="Reproducir ${esc(title)}">
      <img src="https://i.ytimg.com/vi/${esc(first)}/hqdefault.jpg" alt="" loading="lazy">
      <span class="pl"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>
      ${n?`<span class="n">${n} ${plural(n,'vídeo','vídeos')}</span>`:''}</button>
    <div class="cb"><p>${esc(title)}</p><a href="https://www.youtube.com/playlist?list=${esc(id)}" target="_blank" rel="noopener">YouTube ↗</a></div></div>`;
}

/* ===================== menús ===================== */
function menus(cur){
  document.getElementById('desk').innerHTML = COURSES.map(c => `
    <div class="ddw ${c.id.includes('2-bach')||c.id==='1-bach'?'r':''}" style="${sty(c.id)}">
      <button class="ddb ${c.id===cur?'cur':''}" aria-haspopup="true"><span class="dot"></span>${esc(c.name)}</button>
      <div class="dd"><div class="ddp">
        <a class="all" href="#${c.id}">${esc(c.full)}<span>Ver curso →</span></a>
        ${c.topics.map((t,i)=>`<a href="#${c.id}/${i+1}"><b>${i+1}</b><span>${esc(t.t)}</span></a>`).join('')}
      </div></div></div>`).join('');
  document.getElementById('mob').innerHTML = COURSES.map(c => `
    <details style="${sty(c.id)}"><summary><span class="dot"></span>${esc(c.name)}</summary>
      <a href="#${c.id}">Ver todo el curso →</a>
      ${c.topics.map((t,i)=>`<a href="#${c.id}/${i+1}">${i+1}. ${esc(t.t)}</a>`).join('')}</details>`).join('');
}

/* ===================== buscador (temas y documentos) ===================== */
const INDEX = [];
COURSES.forEach(c => c.topics.forEach((t,i) => {
  INDEX.push({kind:'Temas', c, href:`#${c.id}/${i+1}`, label:t.t, sub:`${c.full} · Tema ${i+1}`,
    hay:norm([t.t,t.k,t.pl.map(k=>L[k][3]).join(' '),c.full,code(c,i)].join(' '))});
  mats(c,i).forEach(m => INDEX.push({kind:'Documentos', c, href:`#${c.id}/${i+1}`, tab:m.tipo, label:m.title, sub:`${c.name} · Tema ${i+1} · ${m.code}`, hay:norm(m.title+' '+m.code+' '+t.t)}));
}));
const sbox = id => `<div class="sbox">${SRCH}<input id="${id}" type="search" placeholder="¿Qué buscas? pH, Hess, Bohr…" aria-label="Buscar en la web" autocomplete="off"><div class="sres" id="${id}-r"></div></div>`;
function bindSearch(id){
  const inp = document.getElementById(id), box = document.getElementById(id+'-r');
  inp.addEventListener('input', () => {
    const q = norm(inp.value.trim()); if(!q){ box.classList.remove('on'); return; }
    const w = q.split(/\s+/), hits = INDEX.filter(x => w.every(v => x.hay.includes(v)));
    const g = k => hits.filter(h=>h.kind===k).slice(0,k==='Temas'?8:20);
    const row = h => `<a href="${h.href}" ${h.tab?`data-go="${h.tab}"`:''} style="${sty(h.c.id)}"><span class="dot"></span><span><b>${esc(h.label)}</b><small>${esc(h.sub)}</small></span></a>`;
    const T = g('Temas'), D = g('Documentos');
    box.innerHTML = (T.length||D.length) ? (T.length?`<p class="k">Temas</p>${T.map(row).join('')}`:'') + (D.length?`<p class="k">Documentos</p>${D.map(row).join('')}`:'')
      : `<p style="padding:10px 12px;margin:0;color:#555a6e;font-weight:700">Nada con «${esc(inp.value)}». Prueba otra palabra.</p>`;
    box.classList.add('on');
  });
}

/* ===================== portada ===================== */
function home(){
  const temas = COURSES.reduce((s,c)=>s+c.topics.length,0), docs = COURSES.reduce((s,c)=>s+nmat(c),0);
  app.innerHTML = `

    <div class="how">
      <div><i style="background:#ffe1e4">▶</i><h3>Vídeos</h3><p>Las listas del canal, colocadas en su tema. Se ven aquí mismo.</p></div>
      <div><i style="background:#dbeafe">✎</i><h3>Apuntes y problemas</h3><p>Teoría, presentaciones, infografías y problemas, muchos resueltos paso a paso.</p></div>
      <div><i style="background:#fef3c7">★</i><h3>Exámenes y PAU</h3><p>Exámenes de otros cursos y preguntas de la PAU de la Comunitat Valenciana.</p></div>
    </div>
  </div></section>

/* ===================== curso y tema ===================== */
function course(c, ti){
  const t = ti!=null ? c.topics[ti] : null;
  const side = `<p>Temas de ${esc(c.name)}</p>` + c.topics.map((x,i)=>{const m=mats(c,i).length;
    return `<a href="#${c.id}/${i+1}" class="${i===ti?'on':''}" ${i===ti?'aria-current="page"':''}><b>${i+1}</b><span>${esc(x.t)}<small>${cnt(x.pl)||'—'} vídeos${m?` · ${m} PDF`:''}${x.revisar?' · <span class="rv">revisar</span>':''}</small></span></a>`}).join('');
  let body;
  if(!t){
    body = `<div class="thead"><h2>Temas del curso</h2></div>
      ${c.note?`<div class="warn">${esc(c.note)}</div>`:''}
      <table class="ov stack" style="margin:14px 0 30px"><thead><tr><th>Tema</th><th class="n">Vídeos</th><th class="n">PDF</th></tr></thead><tbody>
      ${c.topics.map((x,i)=>`<tr><td><a href="#${c.id}/${i+1}">${i+1}. ${esc(x.t)}</a></td><td class="n">${cnt(x.pl)||'—'}</td><td class="n">${mats(c,i).length||'—'}</td></tr>`).join('')}</tbody></table>
      ${(c.course||c.course2)?`<div class="thead"><h2>Curso completo en vídeo</h2></div><div class="grid big" style="margin-top:18px">${[c.course,c.course2].filter(Boolean).map(card).join('')}</div>`:''}`;
  } else {
    const M = mats(c,ti), list = M.filter(m=>m.tipo===tab);
    let inner;
    if(tab==='videos') inner = `<div class="grid ${t.pl.length===1?'solo':'big'}">${t.pl.map(card).join('')}</div>`;
    else if(list.length) inner = `<div class="docs">${list.map(m=>`<div class="doc ${m.tipo}"><span class="pdf">PDF</span>
        <div><div class="t">${esc(m.title)}</div><div class="s"><span class="code">${esc(m.code)}</span><span>${m.pages} ${plural(m.pages,'página','páginas')}</span><span>${size(m.kb)}</span></div></div>
        <a class="btn" href="${esc(m.url)}" target="_blank" rel="noopener">Abrir PDF</a></div>`).join('')}</div>`;
    else inner = `<div class="empty"><b>Todavía no hay ${esc(TABS.find(x=>x[0]===tab)[1].toLowerCase())} en este tema.</b><br>¡Pronto habrá más!</div>`;
    body = `<div class="thead"><h2>${ti+1}. ${esc(t.t)}</h2>
        <div class="meta"><span class="code">${code(c,ti)}</span><span><b>${cnt(t.pl)||'—'}</b> vídeos</span><span><b>${M.length}</b> PDF</span></div>
        ${t.revisar?'<div class="warn">Asignación provisional de vídeos: pendiente de revisar.</div>':''}</div>
      <div class="tabs" role="tablist">${TABS.map(([key,n])=>{const q = key==='videos'?t.pl.length:M.filter(m=>m.tipo===key).length;
        return `<button class="tab ${tab===key?'on':''}" data-tab="${key}" role="tab" aria-selected="${tab===key}">${n}<span>${q}</span></button>`}).join('')}</div>
      ${inner}
      <div class="pn">${ti>0?`<a class="btn ghost" href="#${c.id}/${ti}">← Tema ${ti}</a>`:'<span></span>'}${ti<c.topics.length-1?`<a class="btn" href="#${c.id}/${ti+2}">Tema ${ti+2} →</a>`:''}</div>`;
  }
  app.innerHTML = `
  <section class="chead" style="${sty(c.id)}"><div class="wrap chg">
    <div><div class="crumb"><a href="#">Inicio</a> › <a href="#${c.id}">${esc(c.full)}</a>${t?` › Tema ${ti+1}`:''}</div><h1><span class="lv">${esc(LOOK[c.id].lv)}</span>${esc(LOOK[c.id].sub)}</h1></div>
    ${sbox('cq')}
  </div></section>
  <div class="wrap layout" style="${sty(c.id)}"><nav class="side" aria-label="Temas">${side}</nav><div>${body}</div></div>`;
  bindSearch('cq');
  const on = app.querySelector('.side a.on'); if(on && innerWidth<900) on.scrollIntoView({block:'nearest',inline:'center'});
}

/* ===================== navegación ===================== */
function route(){
  const [cid, n] = location.hash.slice(1).split('/'), c = COURSES.find(x=>x.id===cid);
  menus(c?c.id:null);
  document.getElementById('mob').classList.remove('on');
  if(!c) home(); else { const i = parseInt(n,10)-1; course(c, i>=0 && i<c.topics.length ? i : null); }
}
let pendingTab = null;
document.addEventListener('click', e => {
  const p = e.target.closest('[data-play]');
  if(p){ p.outerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=${encodeURIComponent(p.dataset.play)}&autoplay=1&rel=0" title="Reproductor de YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`; return; }
  const go = e.target.closest('[data-go]');
  if(go){ pendingTab = go.dataset.go; if(go.getAttribute('href')===location.hash){ e.preventDefault(); tab=pendingTab; pendingTab=null; route(); scrollTo(0,0);} return; }
  const tb = e.target.closest('[data-tab]');
  if(tb){ tab = tb.dataset.tab; const y = scrollY; route(); scrollTo(0,y); return; }
  const b = e.target.closest('.ddb');
  if(b){ const w = b.parentElement, was = w.classList.contains('open'); document.querySelectorAll('.ddw.open').forEach(d=>d.classList.remove('open')); if(!was) w.classList.add('open'); return; }
  if(!e.target.closest('.ddw')) document.querySelectorAll('.ddw.open').forEach(d=>d.classList.remove('open'));
  if(!e.target.closest('.sbox')) document.querySelectorAll('.sres.on').forEach(r=>r.classList.remove('on'));
});
document.addEventListener('keydown', e => { if(e.key==='Escape'){ document.querySelectorAll('.ddw.open').forEach(d=>d.classList.remove('open')); document.querySelectorAll('.sres.on').forEach(r=>r.classList.remove('on')); }});
document.getElementById('mobb').addEventListener('click', e => { const m = document.getElementById('mob'); m.classList.toggle('on'); e.currentTarget.setAttribute('aria-expanded', m.classList.contains('on')); });
addEventListener('hashchange', () => { tab = pendingTab || 'videos'; pendingTab = null; route(); scrollTo(0,0); });
route();
}
</script>
